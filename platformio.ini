; Proyecto: IOT-A909C5AD6F
; Internet de las Cosas - Actividad 1 y 2
; ESP32 DevKit v1 + MQ2 + OLED SSD1306 + Buzzer + LED WiFi

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Librerías externas
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0

; Flags de compilación
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -Wl,-u,ld_esp32_has_phynv